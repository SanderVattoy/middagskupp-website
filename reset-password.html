<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tilbakestill passord — MiddagsKupp</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #4b39ef;
      --primary-dark: #3b2bbf;
      --bg: #f5f5f7;
      --white: #ffffff;
      --text: #0f1113;
      --muted: #57636c;
      --error: #e53935;
      --success: #2e7d32;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }

    .logo {
      font-family: 'Outfit', sans-serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 8px;
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 22px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
    }

    p.subtitle {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 28px;
      line-height: 1.5;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid #e0e3e7;
      border-radius: 10px;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 16px;
    }

    input:focus { border-color: var(--primary); }

    button {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 4px;
    }

    button:hover { background: var(--primary-dark); }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .message {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      display: none;
    }

    .message.error {
      background: #ffebee;
      color: var(--error);
      display: block;
    }

    .message.success {
      background: #e8f5e9;
      color: var(--success);
      display: block;
    }

    .open-app {
      display: none;
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
      color: var(--muted);
    }

    .open-app a {
      color: var(--primary);
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">MiddagsKupp</div>
    <h1>Nytt passord</h1>
    <p class="subtitle">Skriv inn ditt nye passord nedenfor.</p>

    <div id="form-section">
      <label for="password">Nytt passord</label>
      <input type="password" id="password" placeholder="Minst 6 tegn" />

      <label for="confirm">Bekreft passord</label>
      <input type="password" id="confirm" placeholder="Gjenta passordet" />

      <button id="btn" onclick="resetPassword()">Oppdater passord</button>
    </div>

    <div class="message" id="message"></div>

    <div class="open-app" id="open-app">
      <p>Passordet er oppdatert! Du kan nå logge inn i appen.</p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://eepfzbowjjduzjpjheuc.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVlcGZ6Ym93ampkdXpqcGpoZXVjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MDk4MzI5NTIsImV4cCI6MjAyNTQwODk1Mn0.8bWQPf8YPvwP0dSXSEVQaqWJf5wFxEnOCt7fNVXnkSE';

    const { createClient } = supabase;
    const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Håndter token fra URL
    async function init() {
      const hash = window.location.hash;
      const params = new URLSearchParams(hash.substring(1));
      const accessToken = params.get('access_token');
      const refreshToken = params.get('refresh_token');

      if (accessToken) {
        await client.auth.setSession({ access_token: accessToken, refresh_token: refreshToken });
      }
    }

    init();

    async function resetPassword() {
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      const btn = document.getElementById('btn');
      const msg = document.getElementById('message');

      msg.className = 'message';
      msg.textContent = '';

      if (password.length < 6) {
        msg.className = 'message error';
        msg.textContent = 'Passordet må være minst 6 tegn.';
        return;
      }

      if (password !== confirm) {
        msg.className = 'message error';
        msg.textContent = 'Passordene stemmer ikke overens.';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Oppdaterer...';

      const { error } = await client.auth.updateUser({ password });

      if (error) {
        msg.className = 'message error';
        msg.textContent = 'Noe gikk galt. Prøv å be om ny lenke i appen.';
        btn.disabled = false;
        btn.textContent = 'Oppdater passord';
      } else {
        document.getElementById('form-section').style.display = 'none';
        msg.className = 'message success';
        msg.textContent = '✓ Passordet er oppdatert! Du kan nå logge inn i appen.';
        document.getElementById('open-app').style.display = 'block';
      }
    }
  </script>
</body>
</html>
